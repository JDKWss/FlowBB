services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Set ASPNETCORE_ENVIRONMENT in .env}
      NEO4J_URI: ${NEO4J_URI:?Set NEO4J_URI in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:?Set NEO4J_DATABASE in .env}
      NEO4J_USERNAME: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_SEED_ON_STARTUP: ${NEO4J_SEED_ON_STARTUP:-false}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:?Set the client origin in .env}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:?Set the dashboard origin in .env}
      Routing__ServiceUrl: ${ROUTING_SERVICE_URL:-http://routing:8000}
      Routing__TimeoutSeconds: ${ROUTING_TIMEOUT_SECONDS:-3}
      Routing__DemoFallbackEnabled: ${ROUTING_DEMO_FALLBACK_ENABLED:-true}
      # Logi do Seq z kontenera. localhost w kontenerze API to nie kontener Seq, wiec adres z appsettings.json jest nadpisywany.
      # Indeks 1 wskazuje wpis "Seq" w Serilog:WriteTo (0 = Console); zmiana kolejnosci w appsettings.json wymaga zmiany tutaj.
      Serilog__WriteTo__1__Args__serverUrl: ${SEQ_SERVER_URL:-http://seq:5341}
    # Celowo brak depends_on: routing i Seq nie moga blokowac startu API.
    ports:
      - "8080:8080"
    # Gotowosc (issue #55): 200 gdy API laczy sie z Neo4j, 503 gdy nie. Obraz aspnet nie ma curl ani wget,
    # wiec zapytanie HTTP idzie przez bash i /dev/tcp (bash, grep i head sa w obrazie).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  routing:
    build:
      context: ../routing-service
    environment:
      ROUTING_DATA_DIR: /app/data
      ROUTING_MAX_SNAP_METERS: ${ROUTING_MAX_SNAP_METERS:-500}
      ROUTING_WALKING_SPEED_KMH: ${ROUTING_WALKING_SPEED_KMH:-4.8}
      ROUTING_BIKE_SPEED_KMH: ${ROUTING_BIKE_SPEED_KMH:-15}
    expose:
      - "8000"
    volumes:
      - routing-data:/app/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import json, urllib.request; data=json.load(urllib.request.urlopen("http://localhost:8000/health", timeout=2)); raise SystemExit(0 if data.get("status") == "ready" else 1)'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  routing-prepare:
    profiles: ["routing-tools"]
    build:
      context: ../routing-service
    user: "0:0"
    command: ["python", "scripts/build_graphs.py", "--output", "/app/data"]
    volumes:
      - routing-data:/app/data

  # Dodatek developerski (issue #49): podglad logow strukturalnych. Adres UI: http://localhost:${SEQ_HOST_PORT:-5341} (tylko z tego komputera).
  seq:
    image: datalust/seq:2026.1.17114
    environment:
      ACCEPT_EULA: "Y"
      # Dziala tylko przy pierwszym uruchomieniu z pustym wolumenem. Bezpieczne, bo UI jest publikowane wylacznie na 127.0.0.1.
      # Na wspolnej maszynie ustaw SEQ_FIRSTRUN_NOAUTHENTICATION=false i skonfiguruj haslo w UI Seq (patrz .env.example).
      SEQ_FIRSTRUN_NOAUTHENTICATION: ${SEQ_FIRSTRUN_NOAUTHENTICATION:-true}
    ports:
      - "127.0.0.1:${SEQ_HOST_PORT:-5341}:80"
    volumes:
      - seq-data:/data

  # Tymczasowy szkic; docelowa konfiguracja Neo4j pochodzi z issue #8 (Data/Neo4j Owner).
  neo4j:
    profiles: ["local-db"]
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'username="$${NEO4J_AUTH%%/*}"; password="$${NEO4J_AUTH#*/}"; cypher-shell -a neo4j://localhost:7687 -u "$$username" -p "$$password" "RETURN 1"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j-data:
  routing-data:
  seq-data:
