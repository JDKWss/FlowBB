services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?Set ASPNETCORE_ENVIRONMENT in .env}
      NEO4J_URI: ${NEO4J_URI:?Set NEO4J_URI in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:?Set NEO4J_DATABASE in .env}
      NEO4J_USERNAME: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:?Set the client origin in .env}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:?Set the dashboard origin in .env}
    ports:
      - "8080:8080"

  # Tymczasowy szkic; docelowa konfiguracja Neo4j pochodzi z issue #8 (Data/Neo4j Owner).
  neo4j:
    profiles: ["local-db"]
    image: neo4j:5.26.30-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'username="$${NEO4J_AUTH%%/*}"; password="$${NEO4J_AUTH#*/}"; cypher-shell -a neo4j://localhost:7687 -u "$$username" -p "$$password" "RETURN 1"'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j-data:
