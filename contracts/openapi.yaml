openapi: 3.0.3

info:
  title: FlowBB API
  version: 0.1.0
  description: |
    Kontrakt API dla prototypu FlowBB tworzonego na HackBB 2026.

    System laczy trzy moduly:
    - FLOW - wydarzenia, deklaracja uczestnictwa i plan dojazdu,
    - CREW - mikrogrupy wokol wydarzen,
    - PULSE - zagregowane dane popytu dla miasta.

    MVP nie ma pelnego uwierzytelniania. `userId` wskazuje jednego z
    seedowanych uzytkownikow demonstracyjnych.

servers:
  - url: http://localhost:5098
    description: Lokalne API uruchomione przez `dotnet run`
  - url: http://localhost:8080
    description: API uruchomione przez Docker Compose (port hosta 8080)

tags:
  - name: Health
    description: Kontrola gotowosci API
  - name: Events
    description: Wydarzenia dostepne dla mieszkanca
  - name: Attendance
    description: Deklaracje uczestnictwa i preferencje transportowe
  - name: Groups
    description: Mikrogrupy CREW
  - name: Routing
    description: Trasy z IRoutePlanner
  - name: Pulse
    description: Zagregowane dane dla panelu miasta
  - name: AirQuality
    description: Jakosc powietrza dla lokalizacji wydarzenia

paths:
  /health:
    get:
      tags: [Health]
      summary: Sprawdza zywotnosc procesu API
      description: |
        Test zywotnosci (liveness): nie zalezy od bazy danych i zawsze zwraca 200,
        dopoki proces API odpowiada. Gotowosc wraz z Neo4j sprawdza `/health/ready`.
      operationId: getHealth
      responses:
        "200":
          description: Proces API dziala
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: Healthy
                timestamp: "2026-09-19T17:20:00Z"

  /health/ready:
    get:
      tags: [Health]
      summary: Sprawdza gotowosc API (polaczenie z Neo4j)
      description: |
        Test gotowosci (readiness): 200, gdy API laczy sie z Neo4j, 503, gdy nie.
        Odpowiedz nie zawiera szczegolow bledu (adresow, danych logowania ani
        komunikatow wyjatkow) i nie jest cache'owana. Uzywa go healthcheck kontenera `api`.
      operationId: getReadiness
      responses:
        "200":
          description: API jest gotowe do obslugi zadan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: Healthy
                timestamp: "2026-09-19T17:20:00Z"
        "503":
          description: Neo4j jest niedostepne albo nie odpowiada w limicie czasu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: Unhealthy
                timestamp: "2026-09-19T17:20:00Z"

  /api/events:
    get:
      tags: [Events]
      summary: Zwraca liste wydarzen
      operationId: getEvents
      parameters:
        - name: from
          in: query
          required: false
          description: Początek opcjonalnego zakresu czasu
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Koniec opcjonalnego zakresu czasu
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lista wydarzen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventSummary"
              examples:
                demo:
                  value:
                    - id: "11111111-1111-1111-1111-111111111111"
                      name: "Koncert na Rynku"
                      description: "Wieczorny koncert w centrum Bielska-Bialej."
                      startAt: "2026-09-19T19:00:00+02:00"
                      endAt: "2026-09-19T21:30:00+02:00"
                      venueName: "Rynek w Bielsku-Bialej"
                      category: Culture
                      location:
                        latitude: 49.82245
                        longitude: 19.04431
                      participantsCount: 82
                      source: Demo
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Events]
      summary: Tworzy wydarzenie organizatora
      description: |
        Tworzy wydarzenie oraz dedykowane miejsce w Neo4j. Identyfikatory
        wydarzenia i miejsca sa generowane przez backend, `source` ma zawsze
        wartosc `External`, a liczba uczestnikow jest wyliczana z deklaracji
        i poczatkowo wynosi 0.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
            example:
              name: "HackBB Afterparty"
              description: "Spotkanie po wydarzeniu."
              startAt: "2026-09-20T19:00:00+02:00"
              endAt: "2026-09-20T22:00:00+02:00"
              venueName: "Bielsko-Biała"
              category: Community
              location:
                latitude: 49.82
                longitude: 19.04
      responses:
        "201":
          description: Wydarzenie i miejsce zostaly utworzone
          headers:
            Location:
              description: Adres utworzonego wydarzenia
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Zwraca szczegoly wydarzenia
      operationId: getEventById
      responses:
        "200":
          description: Szczegoly wydarzenia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetails"
        "400":
          description: |
            `eventId` nie jest niepustym UUID. Niepoprawny format identyfikatora jest
            bledem zadania (400) i jest odrozniany od poprawnego UUID nieistniejacego
            wydarzenia (404).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              example:
                title: "Path parameter 'eventId' must be a non-empty UUID."
                status: 400
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/events/{eventId}/air-quality:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [AirQuality]
      summary: Zwraca jakosc powietrza dla lokalizacji wydarzenia
      description: |
        Stacja jest wybierana wzgledem wspolrzednych wydarzenia, nigdy wzgledem
        lokalizacji mieszkanca. Awaria, timeout albo bezuzyteczna odpowiedz GIOS
        nie powoduja publicznego 5xx: implementacja zwraca 200 ze
        `status: Fallback` i `source: Demo`.
      operationId: getEventAirQuality
      responses:
        "200":
          description: Dane GIOS albo deterministyczne dane demonstracyjne fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AirQualityResponse"
              example:
                eventId: "11111111-1111-1111-1111-111111111111"
                station:
                  name: "Bielsko-Biała, ul. Kossak-Szczuckiej"
                  distanceMeters: 1450
                measuredAt: "2026-09-20T07:00:00+02:00"
                qualityLevel: Good
                status: Fresh
                source: Gios
                pm10:
                  value: 18.4
                  unit: "µg/m³"
                pm25: null
                no2:
                  value: 12.1
                  unit: "µg/m³"
                o3:
                  value: 46.8
                  unit: "µg/m³"
                alert: null
        "400":
          description: "`eventId` nie jest niepustym UUID"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: UUID jest poprawny, ale wydarzenie nie istnieje
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Nieoczekiwany blad FlowBB, niezalezny od dostepnosci GIOS
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/events/{eventId}/attendance:
    parameters:
      - $ref: "#/components/parameters/EventId"
    post:
      tags: [Attendance]
      summary: Deklaruje uczestnictwo w wydarzeniu
      description: |
        Operacja jest idempotentna dla pary `userId-eventId`.
        Pierwsze wywolanie tworzy `AttendanceIntent`. Powtorzenie aktualizuje
        preferencje transportowa, ale nie zwieksza ponownie licznika.

        Po zapisie backend publikuje komunikat SignalR `PulseUpdated`.
      operationId: upsertAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpsertRequest"
            examples:
              publicTransport:
                value:
                  userId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                  transportMode: PublicTransport
      responses:
        "200":
          description: Deklaracja zapisana lub zaktualizowana
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceResponse"
              examples:
                joined:
                  value:
                    eventId: "11111111-1111-1111-1111-111111111111"
                    userId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                    transportMode: PublicTransport
                    participantsCount: 83
                    isNew: true
                    updatedAt: "2026-09-19T17:20:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/events/{eventId}/attendance/{userId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Attendance]
      summary: Usuwa deklaracje uczestnictwa
      description: |
        Operacja jest idempotentna. Brak deklaracji nie powoduje bledu.
        Po zmianie backend publikuje `PulseUpdated`.
      operationId: deleteAttendance
      responses:
        "204":
          description: Deklaracja nie istnieje po zakonczeniu operacji
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/events/{eventId}/groups:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Groups]
      summary: Zwraca mikrogrupy wydarzenia
      operationId: getEventGroups
      parameters:
        - name: userId
          in: query
          required: false
          description: Pozwala oznaczyc grupe, do ktorej dolaczyl uzytkownik
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista grup CREW
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
              examples:
                demo:
                  value:
                    - id: "22222222-2222-2222-2222-222222222222"
                      eventId: "11111111-1111-1111-1111-111111111111"
                      name: "Nowi w Bielsku"
                      description: "Mikrogrupa dla osob, ktore chca poznac miasto."
                      currentMembers: 4
                      maxMembers: 6
                      tags: ["nowi-w-miescie", "muzyka"]
                      meetingPoint:
                        name: "Plac Chrobrego"
                        latitude: 49.82205
                        longitude: 19.04318
                      joinedByCurrentUser: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/groups/{groupId}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags: [Groups]
      summary: Dolacza uzytkownika do mikrogrupy
      description: Operacja jest idempotentna dla pary `userId-groupId`.
      operationId: joinGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembershipRequest"
            example:
              userId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
      responses:
        "200":
          description: Aktualny stan grupy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Grupa jest pelna albo uzytkownik nalezy do innej wykluczajacej grupy
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [Groups]
      summary: Usuwa uzytkownika z mikrogrupy
      description: Operacja jest idempotentna.
      operationId: leaveGroup
      responses:
        "204":
          description: Uzytkownik nie nalezy do grupy po zakonczeniu operacji
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/events/{eventId}/route:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Routing]
      summary: Zwraca proponowana trase na wydarzenie i powrot
      description: |
        Trasa zawsze jest pobierana przez `IRoutePlanner`. API zwraca
        `plannerSource: RoadRouting` dla prawdziwej trasy drogowej oraz
        `plannerSource: Demo` dla komunikacji miejskiej lub kontrolowanego fallbacku.

        Punkt startu i srodek transportu pochodza ze snapshotu deklaracji
        "Ide" (relacja `IS_GOING_TO`) zapisanego przez `upsertAttendance`.
        Klient nie przesyla wspolrzednych: backend czyta punkt startu ze
        snapshotu Attendance. Profil ani osobne pole origin nie sa ujawniane;
        mieszkaniec moze otrzymac GeoJSON swojej wyliczonej trasy. Brak
        deklaracji dla pary uzytkownik-wydarzenie oznacza 404. Zapisany
        srodek transportu `Unknown` (brakujacy lub niepoprawny) oznacza 400,
        bo nie mozna zaplanowac trasy.
      operationId: getEventRoute
      parameters:
        - $ref: "#/components/parameters/RequiredUserIdQuery"
      responses:
        "200":
          description: Plan podrozy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
              examples:
                demo:
                  value:
                    eventId: "11111111-1111-1111-1111-111111111111"
                    userId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                    plannerSource: Demo
                    outbound:
                      durationMinutes: 37
                      departureAt: "2026-09-19T18:12:00+02:00"
                      arrivalAt: "2026-09-19T18:49:00+02:00"
                      steps:
                        - type: Walk
                          instruction: "Idz 6 minut do przystanku."
                          durationMinutes: 6
                        - type: Transit
                          instruction: "Wsiadz do autobusu linii 7."
                          durationMinutes: 19
                          line: "7"
                        - type: Walk
                          instruction: "Idz 4 minuty na Rynek."
                          durationMinutes: 4
                    returns:
                      - durationMinutes: 34
                        departureAt: "2026-09-19T21:44:00+02:00"
                        arrivalAt: "2026-09-19T22:18:00+02:00"
                        steps:
                          - type: Transit
                            instruction: "Autobus linii 7."
                            durationMinutes: 26
                            line: "7"
                    returnGap: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/pulse/summary:
    get:
      tags: [Pulse]
      summary: Zwraca ogolne KPI panelu PULSE
      operationId: getPulseSummary
      responses:
        "200":
          description: Zagregowane KPI wszystkich wydarzen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PulseSummary"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/pulse/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Pulse]
      summary: Zwraca KPI i alerty wybranego wydarzenia
      operationId: getEventPulse
      responses:
        "200":
          description: PULSE wydarzenia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPulseResponse"
              example:
                eventId: "11111111-1111-1111-1111-111111111111"
                eventName: "Koncert na Rynku"
                generatedAt: "2026-09-19T17:20:00Z"
                participantsCount: 83
                modalSplit:
                  publicTransport: 49
                  walking: 18
                  bike: 6
                  car: 7
                  unknown: 3
                participantsWithoutReturn: 21
                alerts:
                  - code: ReturnGap
                    severity: Warning
                    message: "21 osob nie ma dogodnego powrotu po 22:00."
        "400":
          description: |
            `eventId` nie jest niepustym UUID (odrozniane od poprawnego UUID
            nieistniejacego wydarzenia, ktore daje 404).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/pulse/hexagons:
    get:
      tags: [Pulse]
      summary: Zwraca zagregowane heksagony popytu jako GeoJSON
      description: |
        Backend zwraca tylko komorki z `participants >= 10`.
        Dashboard nigdy nie otrzymuje surowych lokalizacji ani identyfikatorow
        uzytkownikow. Geometria wyjsciowa korzysta z EPSG:4326.
      operationId: getPulseHexagons
      parameters:
        - name: eventId
          in: query
          required: true
          description: Id wydarzenia
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: GeoJSON FeatureCollection z heksagonami
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/HexagonFeatureCollection"
              example:
                type: FeatureCollection
                features:
                  - type: Feature
                    id: "hex-2180-001"
                    geometry:
                      type: Polygon
                      coordinates:
                        - - [19.0200, 49.8150]
                          - [19.0300, 49.8150]
                          - [19.0350, 49.8220]
                          - [19.0300, 49.8290]
                          - [19.0200, 49.8290]
                          - [19.0150, 49.8220]
                          - [19.0200, 49.8150]
                    properties:
                      participants: 37
                      publicTransport: 23
                      walking: 8
                      bike: 2
                      car: 4
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: Id wydarzenia
      schema:
        type: string
        format: uuid

    GroupId:
      name: groupId
      in: path
      required: true
      description: Id mikrogrupy
      schema:
        type: string
        format: uuid

    UserId:
      name: userId
      in: path
      required: true
      description: Id seedowanego uzytkownika
      schema:
        type: string
        format: uuid

    RequiredUserIdQuery:
      name: userId
      in: query
      required: true
      description: Id seedowanego uzytkownika
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: |
        Nieprawidlowe dane wejsciowe: pusty lub niepoprawny identyfikator (UUID),
        niepoprawny albo pusty JSON, brak naglowka `Content-Type: application/json`,
        nieznany `transportMode` lub nieprawidlowy zakres `from`/`to`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    NotFound:
      description: Zasob nie istnieje
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    InternalServerError:
      description: Nieoczekiwany blad serwera
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [Healthy, Unhealthy]
          description: |
            `Healthy` dla `/health` (zawsze) i dla `/health/ready` z osiagalna baza,
            `Unhealthy` tylko dla `/health/ready` z kodem 503.
        timestamp:
          type: string
          format: date-time

    GeoPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    MeetingPoint:
      allOf:
        - $ref: "#/components/schemas/GeoPoint"
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120

    EventSummary:
      type: object
      required:
        - id
        - name
        - description
        - startAt
        - venueName
        - category
        - location
        - participantsCount
        - source
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
          nullable: true
        venueName:
          type: string
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/EventCategory"
        location:
          $ref: "#/components/schemas/GeoPoint"
        participantsCount:
          type: integer
          minimum: 0
        source:
          type: string
          enum: [Demo, City, External]

    CreateEventRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - startAt
        - venueName
        - category
        - location
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 1000
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
          nullable: true
        venueName:
          type: string
          minLength: 1
          maxLength: 160
        category:
          $ref: "#/components/schemas/EventCategory"
        location:
          $ref: "#/components/schemas/GeoPoint"

    EventDetails:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required: [crewAvailable, availableTransportModes]
          properties:
            externalId:
              type: string
              nullable: true
            crewAvailable:
              type: boolean
            availableTransportModes:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/TransportMode"

    AirQualityResponse:
      type: object
      additionalProperties: false
      required:
        - eventId
        - station
        - measuredAt
        - qualityLevel
        - status
        - source
        - pm10
        - pm25
        - no2
        - o3
        - alert
      properties:
        eventId:
          type: string
          format: uuid
        station:
          $ref: "#/components/schemas/AirQualityStation"
        measuredAt:
          type: string
          format: date-time
          description: ISO 8601 z jawnym offsetem Europe/Warsaw, np. `2026-09-20T07:00:00+02:00`.
        qualityLevel:
          $ref: "#/components/schemas/AirQualityLevel"
        status:
          $ref: "#/components/schemas/AirQualityStatus"
        source:
          $ref: "#/components/schemas/AirQualitySource"
        pm10:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AirQualityMeasurement"
        pm25:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AirQualityMeasurement"
        no2:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AirQualityMeasurement"
        o3:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AirQualityMeasurement"
        alert:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AirQualityAlert"

    AirQualityStation:
      type: object
      additionalProperties: false
      required: [name, distanceMeters]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        distanceMeters:
          type: number
          format: double
          minimum: 0
          description: Odleglosc w linii prostej od lokalizacji wydarzenia do stacji.

    AirQualityMeasurement:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value:
          type: number
          format: double
          minimum: 0
        unit:
          type: string
          enum: ["µg/m³"]

    AirQualityLevel:
      type: string
      description: |
        Odwzorowanie indeksu GIOS: Bardzo dobry = VeryGood, Dobry = Good,
        Umiarkowany = Moderate, Dostateczny = Sufficient, Zly = Bad,
        Bardzo zly = VeryBad, Brak indeksu = Unknown.
      enum: [VeryGood, Good, Moderate, Sufficient, Bad, VeryBad, Unknown]

    AirQualityStatus:
      type: string
      description: |
        Fresh: wiek pomiaru <= 90 minut. Stale: dostepny pomiar GIOS jest starszy
        niz 90 minut. Fallback: brak uzytecznych danych zewnetrznych i uzyto
        deterministycznych danych demonstracyjnych.
      enum: [Fresh, Stale, Fallback]

    AirQualitySource:
      type: string
      description: |
        Gios oznacza dane z GIOS; Demo oznacza snapshot demonstracyjny FlowBB. Dozwolone pary ze `status`:
        Fresh i Stale tylko z Gios, Fallback tylko z Demo.
      enum: [Gios, Demo]

    AirQualityAlert:
      type: object
      additionalProperties: false
      required: [severity, message]
      properties:
        severity:
          type: string
          enum: [Info, Warning]
        message:
          type: string
          minLength: 1
          maxLength: 300

    EventCategory:
      type: string
      enum:
        - Culture
        - Sport
        - Education
        - Community
        - Other

    TransportMode:
      type: string
      enum:
        - Walking
        - PublicTransport
        - Bike
        - Car
        - Unknown

    AttendanceUpsertRequest:
      type: object
      additionalProperties: false
      required: [userId, transportMode]
      properties:
        userId:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"

    AttendanceResponse:
      type: object
      additionalProperties: false
      required:
        - eventId
        - userId
        - transportMode
        - participantsCount
        - isNew
        - updatedAt
      properties:
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        participantsCount:
          type: integer
          minimum: 0
        isNew:
          type: boolean
          description: True tylko, gdy utworzono nowa deklaracje
        updatedAt:
          type: string
          format: date-time

    GroupMembershipRequest:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid

    GroupSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - eventId
        - name
        - description
        - currentMembers
        - maxMembers
        - tags
        - meetingPoint
        - joinedByCurrentUser
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        currentMembers:
          type: integer
          minimum: 0
        maxMembers:
          type: integer
          minimum: 2
          maximum: 12
        tags:
          type: array
          uniqueItems: true
          maxItems: 10
          items:
            type: string
            maxLength: 40
        meetingPoint:
          $ref: "#/components/schemas/MeetingPoint"
        joinedByCurrentUser:
          type: boolean

    PlannerSource:
      type: string
      enum: [Demo, RoadRouting, OpenTripPlanner]

    RouteGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            description: Para [longitude, latitude]; zakres latitude jest dodatkowo walidowany przez aplikacje.
            items:
              type: number
              minimum: -180
              maximum: 180

    RouteStepType:
      type: string
      enum: [Walk, Transit, Bike, Car, Wait]

    RouteStep:
      type: object
      additionalProperties: false
      required: [type, instruction, durationMinutes]
      properties:
        type:
          $ref: "#/components/schemas/RouteStepType"
        instruction:
          type: string
          maxLength: 300
        durationMinutes:
          type: integer
          minimum: 0
        line:
          type: string
          nullable: true
          maxLength: 40

    JourneyOption:
      type: object
      additionalProperties: false
      required: [durationMinutes, departureAt, arrivalAt, steps]
      properties:
        durationMinutes:
          type: integer
          minimum: 0
        distanceMeters:
          type: number
          nullable: true
          minimum: 0
        departureAt:
          type: string
          format: date-time
        arrivalAt:
          type: string
          format: date-time
        geometry:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RouteGeometry"
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteStep"

    RouteResponse:
      type: object
      additionalProperties: false
      required: [eventId, userId, plannerSource, outbound, returns, returnGap]
      properties:
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        plannerSource:
          $ref: "#/components/schemas/PlannerSource"
        outbound:
          $ref: "#/components/schemas/JourneyOption"
        returns:
          type: array
          items:
            $ref: "#/components/schemas/JourneyOption"
        returnGap:
          type: boolean
          description: True, gdy po wydarzeniu nie ma dogodnego powrotu

    ModalSplit:
      type: object
      additionalProperties: false
      required: [publicTransport, walking, bike, car, unknown]
      properties:
        publicTransport:
          type: integer
          minimum: 0
        walking:
          type: integer
          minimum: 0
        bike:
          type: integer
          minimum: 0
        car:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0

    PulseSummary:
      type: object
      additionalProperties: false
      required:
        - generatedAt
        - eventsCount
        - participantsCount
        - modalSplit
        - participantsWithoutReturn
      properties:
        generatedAt:
          type: string
          format: date-time
        eventsCount:
          type: integer
          minimum: 0
        participantsCount:
          type: integer
          minimum: 0
        modalSplit:
          $ref: "#/components/schemas/ModalSplit"
        participantsWithoutReturn:
          type: integer
          minimum: 0

    PulseAlert:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum: [ReturnGap, HighDemand, LowCoverage]
        severity:
          type: string
          enum: [Info, Warning, Critical]
        message:
          type: string
          maxLength: 300

    EventPulseResponse:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventName
        - generatedAt
        - participantsCount
        - modalSplit
        - participantsWithoutReturn
        - alerts
      properties:
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
        generatedAt:
          type: string
          format: date-time
        participantsCount:
          type: integer
          minimum: 0
        modalSplit:
          $ref: "#/components/schemas/ModalSplit"
        participantsWithoutReturn:
          type: integer
          minimum: 0
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/PulseAlert"

    HexagonProperties:
      type: object
      additionalProperties: false
      required: [participants, publicTransport, walking, bike, car]
      properties:
        participants:
          type: integer
          minimum: 10
        publicTransport:
          type: integer
          minimum: 0
        walking:
          type: integer
          minimum: 0
        bike:
          type: integer
          minimum: 0
        car:
          type: integer
          minimum: 0

    PolygonGeometry:
      type: object
      additionalProperties: false
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          description: Tablica pierscieni GeoJSON; wspolrzedne maja kolejnosc longitude, latitude
          minItems: 1
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
                format: double

    HexagonFeature:
      type: object
      additionalProperties: false
      required: [type, id, geometry, properties]
      properties:
        type:
          type: string
          enum: [Feature]
        id:
          type: string
        geometry:
          $ref: "#/components/schemas/PolygonGeometry"
        properties:
          $ref: "#/components/schemas/HexagonProperties"

    HexagonFeatureCollection:
      type: object
      additionalProperties: false
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: "#/components/schemas/HexagonFeature"

    PulseUpdatedMessage:
      type: object
      additionalProperties: false
      required:
        [
          eventId,
          participantsCount,
          modalSplit,
          participantsWithoutReturn,
          changedAt,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        participantsCount:
          type: integer
          minimum: 0
        modalSplit:
          $ref: "#/components/schemas/ModalSplit"
        participantsWithoutReturn:
          type: integer
          minimum: 0
        changedAt:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      description: |
        Odpowiedz zgodna z RFC 7807 / ASP.NET Core ProblemDetails. Kazdy blad API
        (400, 404, 409 i 500 z globalnego handlera) zawiera `traceId`; 500 nie ujawnia
        szczegolow wyjatku.
      additionalProperties: true
      required: [title, status, traceId]
      properties:
        type:
          type: string
          format: uri
          nullable: true
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
        traceId:
          type: string
          description: Identyfikator do skorelowania odpowiedzi z logami (Seq)

x-signalr:
  hub: /hubs/pulse
  clientEvents:
    PulseUpdated:
      description: Publikowane po dodaniu, aktualizacji lub usunieciu AttendanceIntent
      payloadSchema:
        $ref: "#/components/schemas/PulseUpdatedMessage"
